<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AJ Voice Call — 音声通話</title>
  <style>
    html,body,#jitsi-container{height:100%;margin:0;padding:0}
    #jitsi-container{width:100%;height:100%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center}
    #notice{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.5);color:#fff;padding:6px 8px;border-radius:4px;font-size:14px}
  </style>
</head>
<body>
  <div id="notice">音声のみ — パスワードは初期値が設定されています</div>
  <div id="jitsi-container"></div>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script>
    // 設定: 必要に応じてここを書き換えてください
    const ROOM_NAME = 'AJ-voice-call-room';
    const INITIAL_PASSWORD = 'testpass3141';

    function showMessage(msg){
      const c = document.getElementById('jitsi-container');
      c.innerHTML = '<div style="color:#fff;padding:16px">'+msg+'</div>';
    }

    function initJitsi(){
      if(typeof JitsiMeetExternalAPI === 'undefined'){
        showMessage('Jitsi API を読み込めませんでした。ネットワーク接続を確認してください。');
        return;
      }

      const domain = 'meet.jit.si';
      const options = {
        roomName: ROOM_NAME,
        parentNode: document.getElementById('jitsi-container'),
        interfaceConfigOverwrite: {
          TOOLBAR_BUTTONS: ['microphone','hangup'],
          SHOW_JITSI_WATERMARK: false,
          SHOW_WATERMARK_FOR_GUESTS: false
        },
        configOverwrite: {
          startWithVideoMuted: true,
          startAudioOnly: true,
          prejoinPageEnabled: false
        }
      };

      try{
        const api = new JitsiMeetExternalAPI(domain, options);

        // 会議に参加したらパスワードをセット（最初に入った人がモデレーターであれば有効になります）
        api.addEventListener('videoConferenceJoined', () => {
          try{
            api.executeCommand('password', INITIAL_PASSWORD);
          }catch(e){
            // モデレーターでない場合やエラーはここで無視します
            console.warn('パスワード設定に失敗:', e);
          }
        });

        // Android 5.1 の古いブラウザ向けに getUserMedia の存在をチェックしておく
        if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
          // 画面に警告を出すが、Jitsi 側が別途扱うことが多い
          console.warn('getUserMedia 未サポート: 音声が取れない可能性があります');
        }

      }catch(err){
        console.error(err);
        showMessage('通話の初期化に失敗しました。コンソールを確認してください。');
      }
    }

    window.addEventListener('load', initJitsi);
  </script>
</body>
</html>
