<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AJ Voice Call</title>
  <style>
    html,body,#jitsi-container{height:100%;margin:0;padding:0}
    #jitsi-container{width:100%;height:100%;background:#000}
    #my-id{position:absolute;top:8px;right:8px;color:#fff;background:rgba(0,0,0,0.5);padding:6px 8px;border-radius:4px;font-family:monospace;font-size:13px}
  </style>
</head>
<body>
  <div id="my-id">ID: <span id="myId">...</span></div>
  <div id="jitsi-container"></div>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script>
    const ROOM_NAME = 'AJ-voice-call-room';
    const MAX_UNIQUE_ATTEMPTS = 6;

    function generateId(){
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let s = '';
      for(let i=0;i<8;i++) s += chars.charAt(Math.floor(Math.random()*chars.length));
      return s;
    }

    function setMyId(id){ document.getElementById('myId').textContent = id; }

    let api = null;
    let currentId = null;
    let attempts = 0;

    function startWithId(id){
      if(api){ try{ api.dispose(); }catch(e){} api = null; }
      currentId = id; setMyId(id);

      const domain = 'meet.jit.si';
      const options = {
        roomName: ROOM_NAME,
        parentNode: document.getElementById('jitsi-container'),
        interfaceConfigOverwrite: { TOOLBAR_BUTTONS: ['microphone','hangup'], SHOW_JITSI_WATERMARK: false },
        configOverwrite: { startWithVideoMuted: true, startAudioOnly: true, prejoinPageEnabled: false },
        userInfo: { displayName: id }
      };

      try{
        api = new JitsiMeetExternalAPI(domain, options);
        api.addEventListener('videoConferenceJoined', () => setTimeout(checkCollision, 400));
        api.addEventListener('participantJoined', () => setTimeout(checkCollision, 400));
      }catch(e){
        document.getElementById('jitsi-container').innerHTML = '<div style="color:#fff;padding:16px">初期化エラー。コンソールを確認してください。</div>';
        console.error(e);
      }
    }

    function checkCollision(){
      if(!api || typeof api.getParticipantsInfo !== 'function') return;
      try{
        const parts = api.getParticipantsInfo();
        const names = parts.map(p => p.displayName || '').filter(Boolean);
        const counts = {};
        names.forEach(n => counts[n] = (counts[n]||0)+1);
        if(counts[currentId] && counts[currentId] > 1){
          if(attempts >= MAX_UNIQUE_ATTEMPTS){ console.warn('collision persists, keeping id', currentId); return; }
          attempts++; startWithId(generateId());
        } else { attempts = 0; }
      }catch(e){ console.warn('participant info error', e); }
    }

    (function(){ startWithId(generateId()); })();
  </script>
</body>
</html>
